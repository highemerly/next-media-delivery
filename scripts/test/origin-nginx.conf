# Integration-test origin serving ./assets with a deliberately generic
# Content-Type. It mimics object storage (Backblaze B2, S3) which labels every
# object binary/octet-stream regardless of what it actually contains, so the
# proxy has to sniff the body to recognise the media.
server {
    listen 80;
    listen [::]:80;
    root   /usr/share/nginx/html;

    # Empty type map: every extension falls through to default_type.
    types { }
    default_type binary/octet-stream;
}
