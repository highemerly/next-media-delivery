name: Release

# リリース。v* タグで、検査（checks・e2e）を全部回し、本番イメージを ghcr へ push し、
# 全部通ったら GitHub Release を作って k8s のマニフェストのリポジトリへイメージの版を上げる PR を出す
# （流れは docs/development.md「リリース」）。
on:
  push:
    tags:
      - 'v*'
  # tag-release.yml（Actions の画面から手で実行）がタグを打ってから呼ぶ。GITHUB_TOKEN で push したタグでは
  # ワークフローが起動しないため、push を待たずに直接呼んでもらう。そのタグは github.sha に付いているので、
  # checkout（既定で github.sha）・checks・e2e もそのタグと同じコミットを見る。
  # 失敗した実行の作り直しは、Actions の画面の Re-run で行う（以前の workflow_dispatch はやめた。任意の
  # ブランチ・任意の版でデプロイの PR まで出せてしまうため）。
  workflow_call:
    inputs:
      version:
        description: 'Version without "v" (e.g., 1.2.3). The tag vX.Y.Z must already point at github.sha'
        type: string
        required: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # go vet / go test。build と並走する。定義は checks.yml に集約（ブランチの CI と同じもの）。
  checks:
    uses: ./.github/workflows/checks.yml

  # インテグレーションテスト。push したばかりの本番イメージそのもの（＝デプロイするもの）で回す。
  # ブランチの CI は差分で e2e を省くことがあるので、リリースではここで必ず通してから先へ進む。
  e2e:
    needs: build
    uses: ./.github/workflows/e2e.yml
    with:
      image: ${{ needs.build.outputs.image }}

  # イメージは検査の結果を待たずに push される（latest も動く）。本番は版を固定し、latest は使わない。
  build:
    runs-on: ubuntu-latest
    # 既定は 360 分。固まったときに6時間待たないよう、ふだん（約1分半）の数倍で切る
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      # e2e が pull するイメージ・k8s マニフェストに書くイメージ
      image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
      # release がノートの起点に使う。前回のタグが無ければ空
      prev_tag: ${{ steps.prev.outputs.prev_tag }}

    steps:
      # 前回のタグを取るため履歴ごと取る
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # tag-release.yml から呼ばれたときは github.ref が main なので、版は入力から取る。タグの push のときは ref から。
      # 入力は `${{ }}` で run: に直接埋めない（シェルの文字列として解釈され、
      # 値に `"` や `$(...)` があればそのまま実行される）。環境変数で渡す
      - name: Extract version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: echo "version=${INPUT_VERSION:-${GITHUB_REF#refs/tags/v}}" >> "$GITHUB_OUTPUT"

      # HEAD^ から辿れるタグのうち版が最大のもの。git describe は同じコミットに複数のタグがあると
      # 版の大小で選ばない（v0.1.7 と v0.1.8 が同じコミットで、v0.1.9 の前回が v0.1.7 になった）。
      - name: Find previous tag
        id: prev
        run: |
          PREV_TAG=$(git tag --merged HEAD^ --sort=-v:refname --list 'v*' | head -1)
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV_TAG:-(none)}"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # 版は ref から取らず value で渡す（tag-release.yml から呼ばれたときは ref が main のため）。
          # latest は下で明示するので、metadata-action の自動の latest は切る
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.version.outputs.version }}
            type=raw,value=latest

      # キャッシュはレジストリに置く。GitHub Actions のキャッシュ（type=gha）はタグの実行で積んだものを
      # ブランチから読めないため。ブランチの e2e（e2e.yml）も同じ buildcache を cache-from で読む。
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          # 本番ノードに合わせる
          platforms: linux/amd64

  # GitHub Release をタグごと（パッチも含む）に作る。全検査が通ったときだけ＝Release がある版はデプロイしてよい版。
  # ノートは GitHub の自動生成（前回のタグからマージされた PR の一覧・英語。分類は .github/release.yml）。
  # 同じノートを create-k8s-pr がデプロイの PR 本文に使う（変更の一覧の出どころを1つにする）。
  release:
    needs: [build, checks, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # generate-notes API も Release の作成も contents: write が要る
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}

    steps:
      # 前回のタグは明示する。省くと GitHub は前回の「Release」を起点にするが、v0.1.8 以前は Release を作っていない。
      - name: Generate release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          PREV_TAG: ${{ needs.build.outputs.prev_tag }}
        run: |
          args=(-f tag_name="v$VERSION" -f target_commitish="$GITHUB_SHA")
          if [ -n "$PREV_TAG" ]; then args+=(-f previous_tag_name="$PREV_TAG"); fi
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          {
            echo "notes<<NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      # タグ名は v$VERSION から作る（tag-release.yml から呼ばれたときは GITHUB_REF_NAME が main のため）
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md"

  create-k8s-pr:
    # ビルド・checks・e2e が全て成功したときだけ k8s マニフェストへ PR する（release が同じ条件で
    # 待っているので、それを待てば足りる）。マニフェストのリポジトリは Flux 同期なので、この PR のマージが
    # そのまま本番へのデプロイになる。
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # マニフェストのリポジトリは非公開。このリポジトリの Actions のログは誰でも読めるので、リポジトリ名と
      # マニフェストのパス（image 行を持つ prd のもの、スペース区切り）もシークレットに置き、ログでは伏せる
      K8S_REPO: ${{ secrets.K8SG1_REPO }}
      K8S_MANIFEST_PATHS: ${{ secrets.K8SG1_MANIFEST_PATHS }}

    steps:
      # 他のリポジトリへ push するので GITHUB_TOKEN は使えない。PAT で作った PR なので向こうの CI も走る
      - name: Checkout k8s repo
        uses: actions/checkout@v7
        with:
          repository: ${{ env.K8S_REPO }}
          token: ${{ secrets.K8SG1_PAT }}
          path: k8s-repo

      # マニフェストの書式が変わって sed が何も書き換えないと、差分が無いので create-pull-request は
      # PR を作らずに黙って成功する（＝デプロイされないのに緑）。書き換わったことを確かめて落とす
      - name: Update image tag
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        working-directory: k8s-repo
        run: |
          repo="${IMAGE%:*}"
          for p in $K8S_MANIFEST_PATHS; do
            sed -i "s|image: ${repo}:.*|image: ${IMAGE}|" "$p"
            grep -q "image: ${IMAGE}$" "$p" || { echo "::error file=$p::image line not updated"; exit 1; }
          done

      # 本文は英語・全アプリ共通の書式（イメージ・ビルドのリンク・release ジョブが生成したノート）。
      # ノートの PR は完全な URL で書かれるので、マニフェストのリポジトリの #N へのリンクに化けない。
      # DB を持たないので、マイグレーションの節と requires-migration ラベルは無い。
      - name: Write PR body
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          NOTES: ${{ needs.release.outputs.notes }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "- Image: \`$IMAGE\`"
            echo "- Build: $RUN_URL"
            echo
            printf '%s\n' "$NOTES"
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          path: k8s-repo
          token: ${{ secrets.K8SG1_PAT }}
          branch: update-next-media-delivery-${{ needs.build.outputs.version }}
          delete-branch: true
          # マニフェストのリポジトリには PR が大量に来るので、自分に assign して「Assigned to you」で見落とさないようにする
          assignees: ${{ github.repository_owner }}
          commit-message: Update next-media-delivery to ${{ needs.build.outputs.version }}
          title: Update next-media-delivery to ${{ needs.build.outputs.version }}
          body-path: ${{ runner.temp }}/pr-body.md
          # app-update: マニフェストのリポジトリに大量に来る PR のうちアプリの版上げを見分ける（全アプリ共通）。
          # アプリ名はタイトルにあるのでアプリ別のラベルは付けない
          labels: app-update
