# GitHub Release の自動生成ノートの分類（docker-build.yml の release ジョブが使う）。
# PR は上から最初に合った見出しに入るので、Renovate の PR（dependencies ラベル）を
# Changes から除いて Dependencies に分ける。
changelog:
  categories:
    - title: Changes
      labels: ['*']
      exclude:
        labels: [dependencies]
    - title: Dependencies
      labels: [dependencies]
