services:
  httpbin:
    image: kennethreitz/httpbin@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; s=socket.create_connection(('localhost',80),2); s.close()"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s

  # Serves ./assets with normal Content-Types (nginx's default mime.types).
  # The origin for the integration tests (ORIGIN_BASE in scripts/test/lib.sh),
  # so they never fetch from the internet.
  origin:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    volumes:
      - ./assets:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/test-image.png"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  # Serves ./assets as binary/octet-stream, reproducing object storage origins
  # (B2/S3) that mislabel media. Used by test 07 for Content-Type sniffing.
  octet-origin:
    image: nginx:alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    volumes:
      - ./assets:/usr/share/nginx/html:ro
      - ./scripts/test/origin-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/test-image.png"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

  media-delivery:
    build: .
    # CI（.github/workflows/e2e.yml）はビルド済み・push 済みのイメージを E2E_IMAGE で渡し、--no-build で起動する。
    # 手元の `docker compose up --build` はこの名前でビルドする。
    image: ${E2E_IMAGE:-next-media-delivery:e2e}
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${ADMIN_PORT:-3001}:${ADMIN_PORT:-3001}"
    tmpfs:
      - /cache
    depends_on:
      httpbin:
        condition: service_healthy
      origin:
        condition: service_healthy
      octet-origin:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/healthz"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s
